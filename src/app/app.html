<header class="barra">
  <div class="barra__interior">
    <div class="barra__marca">
      <img src="/logo.svg" alt="" />
      Gimnasio Titanes
    </div>
  </div>
</header>

<main class="contenedor">
  <section class="pagina__encabezado">
    <h1>Panel del gimnasio</h1>
    <p class="pagina__bajada">
      Resumen del catálogo de clases.
    </p>
  </section>

  <section class="resumen">
    <article class="resumen__tarjeta">
      <strong>{{ totalClases }}</strong>
      <span>Clases</span>
    </article>

    <article class="resumen__tarjeta">
      <strong>{{ minutosSemana }}</strong>
      <span>Minutos a la semana</span>
    </article>

    <article class="resumen__tarjeta">
      <strong>{{ clasesLargas }}</strong>
      <span>Clases de una hora o más</span>
    </article>
  </section>
</main>
